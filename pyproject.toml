[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-workbench"
version = "1.1.0"
description = "RDesk: an AI-friendly, local-first agent workbench with durable tasks and multi-agent collaboration."
authors = [{ name = "任天卓" }, { name = "Codex (AI development assistant)" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=44,<50",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "pypdf>=6.21,<7",
  "pillow>=13,<14",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1.5,<4",
  "python-pptx>=1.0.2,<2",
  "defusedxml>=0.7.1,<1",
  "mcp==2.3.0",
  "jsonschema==4.26.0",
  "keyring==25.7.0",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
workbench = "workbench.entrypoints.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["apps/server/src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/server/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
